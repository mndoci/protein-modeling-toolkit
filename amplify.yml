version: 1
applications:
  - appRoot: molecular-viewer
    frontend:
      phases:
        preBuild:
          commands:
            # Default AL2023 build image ships Node 20; package.json requires >=22.12.
            - nvm install 22 && nvm use 22
            - npm ci
        build:
          commands:
            # vitest run (non-watch); a failing test exits non-zero and stops the deploy.
            - npm test
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
