[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa"
version = "0.1.0"
description = "Secondary Structure Analysis: pure-Python per-residue H/E/C assignment from PDB/mmCIF (no DSSP binary required)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "protein-modeling-toolkit" }]
keywords = ["protein", "secondary-structure", "dssp", "pdb", "mmcif", "bioinformatics"]

# Pinned dependencies (exact versions).
dependencies = [
    "biopython==1.85",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[project.scripts]
ssa = "ssa.cli:main"

[tool.setuptools]
packages = ["ssa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
